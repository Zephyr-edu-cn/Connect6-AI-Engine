# Reserved time in seconds for each player, 15 minutes.
TimeLimit = 900

# Max steps of each game.
# If a game does not end within max steps, the game is terminated as a draw.
MaxStep = 80

# Milliseconds after each step when GUI playback is enabled.
Step_Inter = 500

# Whether to use a GUI.
GUI = false
# GUI implementation class.
GuiType = core.game.ui.connect6.BeautyGUI

# Player IDs. Each ID maps to a corresponding class name, for example "stud.g77.AI".
Player_Ids = 22,11

# Host player ID for league-style evaluation.
# In each hosted game, the host plays first.
Host = 11
